name: Deploy JobFlow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobflow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, linux, jobflow-release]
    timeout-minutes: 25
    env:
      JOBFLOW_PRODUCTION_ENV_FILE: ${{ vars.JOBFLOW_PRODUCTION_ENV_FILE }}
      JOBFLOW_ENABLE_DELIVERY: ${{ vars.JOBFLOW_ENABLE_DELIVERY }}
      JOBFLOW_DELIVERY_ACCEPT_NEW: ${{ vars.JOBFLOW_DELIVERY_ACCEPT_NEW }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and deploy the approved commit
        shell: bash
        run: bash scripts/release.sh deploy
