x-processing: &processing
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: processing
  environment:
    DATABASE_URL: postgresql://jobflow:jobflow_local@postgres:5432/jobflow
    AMQP_URL: amqp://jobflow:jobflow_local@rabbitmq:5672/
    METRICS_HOST: 0.0.0.0
    METRICS_PORT: "9100"
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow_local
    ports:
      - "127.0.0.1:${JOBFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "jobflow",
          "-d",
          "jobflow",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3.8-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: jobflow
      RABBITMQ_DEFAULT_PASS: jobflow_local
    ports:
      - "127.0.0.1:${JOBFLOW_AMQP_PORT:-5672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://jobflow:jobflow_local@postgres:5432/jobflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://jobflow:jobflow_local@postgres:5432/jobflow
      AMQP_URL: amqp://jobflow:jobflow_local@rabbitmq:5672/
      APP_ORIGIN: "http://127.0.0.1:${JOBFLOW_WEB_PORT:-5173}"
      WRITE_RATE_LIMIT: "${JOBFLOW_WRITE_RATE_LIMIT:-60}"
    ports:
      - "127.0.0.1:${JOBFLOW_API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(3000)}).then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 5s
      timeout: 4s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${JOBFLOW_WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

  dispatcher:
    <<: *processing
    command: ["node", "services/dispatcher/src/main.js"]

  worker:
    <<: *processing
    command: ["node", "services/worker/src/main.js"]
    deploy:
      replicas: 2

  scheduler:
    <<: *processing
    command: ["node", "services/scheduler/src/main.js"]

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=7d",
      ]

  grafana:
    image: grafana/grafana:13.2.6
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: jobflow
      GF_SECURITY_ADMIN_PASSWORD: jobflow_grafana_local
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
