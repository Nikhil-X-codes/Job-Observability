global:
  scrape_interval: 15s
  scrape_timeout: 8s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:3000"]
  - job_name: dispatcher
    static_configs:
      - targets: ["dispatcher:9100"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9100"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
